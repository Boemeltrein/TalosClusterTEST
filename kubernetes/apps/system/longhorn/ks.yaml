---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 10m
  timeout: 10m
  path: kubernetes/apps/system/longhorn/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-jobs
  namespace: flux-system
spec:
  dependsOn:
    - name: longhorn
  interval: 1h
  retryInterval: 10m
  timeout: 10m
  path: kubernetes/apps/system/longhorn/jobs
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: false
