---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 10m
  timeout: 10m
  path: kubernetes/apps/system/system-upgrade/tuppr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr-plans
  namespace: flux-system
spec:
  dependsOn:
    - name: tuppr
  interval: 1h
  retryInterval: 10m
  timeout: 10m
  path: kubernetes/apps/system/system-upgrade/tuppr/plans
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: false
