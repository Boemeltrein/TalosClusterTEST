apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librespeed
  namespace: librespeed
spec:
  interval: 1h
  chart:
    spec:
      chart: librespeed
      version: 19.0.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:

    # ingress:
    #   main:
    #     enabled: true
    #     ingressClassName: internal
    #     hosts:
    #       - host: librespeed.${DOMAIN_0}
    #     integrations:
    #       certManager:
    #         enabled: true
    #         certificateIssuer: domain-0-le-prod

    resources:
      requests:
        cpu: 10m
